[platformio]
default_envs = USB_SETUP_INSERTION_RECOVERY
[env]
platform = ch32v
framework = noneos-sdk
board = genericCH32V203C8T6
board_upload.maximum_size = 61440
build_type = release
board_build.use_lto = yes
board_build.use_builtin_debug_code = no
board_build.cpp_support = yes
build_flags =
    -DSYSCLK_FREQ_144MHz_HSI=144000000
    -DBMCU_DM_TWO_MICROSWITCH=1
    -DBMCU_ONLINE_LED_FILAMENT_RGB=1
    -DBMCU_P1S=0
    -DBMCU_SOFT_LOAD=0
    -DBAMBU_BUS_AMS_NUM=0
    -DAMS_RETRACT_LEN=0.095f
[env:ordinary_default]
build_flags =
    ${env.build_flags}
    -DBMCU_EXPERIMENTAL_AMS_LITE=0
    -DBMCU_LITE_SINGLE_CHANNEL_TRIAL=0
    -DBMCU_LITE_MOTORLOCK=0
    -DBMCU_LITE_OWNERSHIP_DETAIL=0
    -DBMCU_LITE_SETUP_TRIAL=0
[env:accepted_ownership_detail_setup_OFF]
build_flags =
    ${env.build_flags}
    -DBMCU_EXPERIMENTAL_AMS_LITE=1
    -DBMCU_LITE_SINGLE_CHANNEL_TRIAL=1
    -DBMCU_LITE_MOTORLOCK=0
    -DBMCU_LITE_OWNERSHIP_DETAIL=1
    -DBMCU_LITE_SETUP_TRIAL=0
[env:WINDOW_CUE_SETUP_TRIAL_NOT_FOR_PRINTING]
build_flags =
    ${env.build_flags}
    -DBMCU_EXPERIMENTAL_AMS_LITE=1
    -DBMCU_LITE_SINGLE_CHANNEL_TRIAL=1
    -DBMCU_LITE_MOTORLOCK=0
    -DBMCU_LITE_OWNERSHIP_DETAIL=1
    -DBMCU_LITE_SETUP_TRIAL=1

[env:FULL_LOAD_EXPERIMENTAL_NOT_FOR_PRINTING]
build_flags =
    ${env.build_flags}
    -DBMCU_EXPERIMENTAL_AMS_LITE=1
    -DBMCU_LITE_SINGLE_CHANNEL_TRIAL=0
    -DBMCU_LITE_MOTORLOCK=0
    -DBMCU_LITE_OWNERSHIP_DETAIL=0
    -DBMCU_LITE_SETUP_TRIAL=1
    -DBMCU_LITE_FULL_LOAD=1

[env:V11_FEATURES_EXPERIMENTAL_NOT_FOR_PRINTING]
build_flags =
    ${env:FULL_LOAD_EXPERIMENTAL_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_V11_FEATURES=1

[env:NATIVE_FEED_AUTHORITY_EXPERIMENTAL_NOT_FOR_PRINTING]
build_flags =
    ${env:V11_FEATURES_EXPERIMENTAL_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_NATIVE_FEED_AUTHORITY=1

[env:NATIVE_AUTHORITY_OBSERVATION_EXPERIMENTAL_NOT_FOR_PRINTING]
build_flags =
    ${env:NATIVE_FEED_AUTHORITY_EXPERIMENTAL_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_AUTHORITY_OBSERVATION=1

[env:NATIVE_IDLE_04_EXPERIMENTAL_NOT_FOR_PRINTING]
build_flags =
    ${env:NATIVE_AUTHORITY_OBSERVATION_EXPERIMENTAL_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_NATIVE_IDLE_04=1

[env:USB_FLIGHT_RECORDER_NOT_FOR_PRINTING]
board_build.ldscript = flight-recorder.ld
board_upload.maximum_size = 60928
build_flags =
    ${env:NATIVE_IDLE_04_EXPERIMENTAL_NOT_FOR_PRINTING.build_flags}
    -DBMCU_USB_FLIGHT_RECORDER=1
    -DBMCU_LITE_SETUP_GESTURE_1S=1

[env:USB_V11_FEED_LATCH_NOT_FOR_PRINTING]
board_build.ldscript = flight-recorder.ld
board_upload.maximum_size = 60928
build_flags =
    ${env:USB_FLIGHT_RECORDER_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_V11_FEED_LATCH=1

[env:USB_LITE_PHASE_COMPAT_NOT_FOR_PRINTING]
board_build.ldscript = flight-recorder.ld
board_upload.maximum_size = 60928
build_flags =
    ${env:USB_V11_FEED_LATCH_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_NATIVE_PHASE_COMPAT=1

[env:USB_INPUT_DETAIL_NOT_FOR_PRINTING]
extends = env:USB_LITE_PHASE_COMPAT_NOT_FOR_PRINTING
build_flags =
    ${env:USB_LITE_PHASE_COMPAT_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_INPUT_FAULT_DETAIL=1

[env:USB_LITE_METER_ORIGIN_NOT_FOR_PRINTING]
extends = env:USB_INPUT_DETAIL_NOT_FOR_PRINTING
build_flags =
    ${env:USB_INPUT_DETAIL_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_METER_ORIGIN_ZERO=1

[env:USB_LITE_GLOBAL_PHASE_NOT_FOR_PRINTING]
extends = env:USB_LITE_METER_ORIGIN_NOT_FOR_PRINTING
build_flags =
    ${env:USB_LITE_METER_ORIGIN_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_GLOBAL_PHASE_COMPAT=1

[env:USB_SETUP_RELEASE_CUE_NOT_FOR_PRINTING]
extends = env:USB_LITE_GLOBAL_PHASE_NOT_FOR_PRINTING
build_flags =
    ${env:USB_LITE_GLOBAL_PHASE_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_SETUP_RELEASE_CUE=1
    -DBMCU_LITE_NATIVE_UNLOAD_CONTINUE=1

[env:USB_LITE_PHASE99_COMPAT_NOT_FOR_PRINTING]
extends = env:USB_SETUP_RELEASE_CUE_NOT_FOR_PRINTING
build_flags =
    ${env:USB_SETUP_RELEASE_CUE_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_PHASE99_COMPAT=1

[env:USB_LITE_PHASE99_03_COMPAT_NOT_FOR_PRINTING]
extends = env:USB_LITE_PHASE99_COMPAT_NOT_FOR_PRINTING
build_flags =
    ${env:USB_LITE_PHASE99_COMPAT_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_PHASE99_03_COMPAT=1

[env:USB_LITE_PHASE99_ALL_SLOTS_NOT_FOR_PRINTING]
extends = env:USB_LITE_PHASE99_03_COMPAT_NOT_FOR_PRINTING
build_flags =
    ${env:USB_LITE_PHASE99_03_COMPAT_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_PHASE99_ALL_SLOTS=1

[env:USB_CONTINUOUS_NATIVE_NOT_FOR_PRINTING]
extends = env:USB_LITE_PHASE99_ALL_SLOTS_NOT_FOR_PRINTING
build_flags =
    ${env:USB_LITE_PHASE99_ALL_SLOTS_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_CONTINUOUS_NATIVE=1

[env:USB_ONUSE_IDLE_COMPAT_NOT_FOR_PRINTING]
extends = env:USB_CONTINUOUS_NATIVE_NOT_FOR_PRINTING
build_flags =
    ${env:USB_CONTINUOUS_NATIVE_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_ONUSE_IDLE_COMPAT=1

[env:USB_UNLOAD_DIAGNOSTIC_CAPTURE_NOT_FOR_PRINTING]
extends = env:USB_ONUSE_IDLE_COMPAT_NOT_FOR_PRINTING
build_flags =
    ${env:USB_ONUSE_IDLE_COMPAT_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_UNLOAD_DIAGNOSTIC_CAPTURE=1

[env:USB_NATIVE_LEASE_FEEDBACK_NOT_FOR_PRINTING]
extends = env:USB_UNLOAD_DIAGNOSTIC_CAPTURE_NOT_FOR_PRINTING
build_flags =
    ${env:USB_UNLOAD_DIAGNOSTIC_CAPTURE_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_LEASE_FEEDBACK=1

[env:USB_AUTOMATIC_CAPTURE_NOT_FOR_PRINTING]
extends = env:USB_NATIVE_LEASE_FEEDBACK_NOT_FOR_PRINTING
build_flags =
    ${env:USB_NATIVE_LEASE_FEEDBACK_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_AUTOMATIC_CAPTURE=1

[env:USB_RX_BACKPRESSURE_NOT_FOR_PRINTING]
extends = env:USB_AUTOMATIC_CAPTURE_NOT_FOR_PRINTING
build_flags =
    ${env:USB_AUTOMATIC_CAPTURE_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_RX_BACKPRESSURE=1

[env:USB_PRECUT_PHASE_NOT_FOR_PRINTING]
extends = env:USB_RX_BACKPRESSURE_NOT_FOR_PRINTING
build_flags =
    ${env:USB_RX_BACKPRESSURE_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_PRECUT_PHASE_CAPTURE=1

[env:USB_ENCODER_RECOVERY_NOT_FOR_PRINTING]
extends = env:USB_PRECUT_PHASE_NOT_FOR_PRINTING
build_flags =
    ${env:USB_PRECUT_PHASE_NOT_FOR_PRINTING.build_flags}
    -DBMCU_LITE_ENCODER_RECOVERY=1

[env:USB_JOURNAL_RETENTION_NOT_FOR_PRINTING]
extends = env:USB_ENCODER_RECOVERY_NOT_FOR_PRINTING
build_flags =
    ${env:USB_ENCODER_RECOVERY_NOT_FOR_PRINTING.build_flags}
    -DBMCU_USB_CONTINUOUS_JOURNAL=1
    -DBMCU_LITE_PHASE99_REQUEST_FEEDBACK=1

[env:USB_WORKING_MODE]
extends = env:USB_JOURNAL_RETENTION_NOT_FOR_PRINTING
build_flags =
    ${env:USB_JOURNAL_RETENTION_NOT_FOR_PRINTING.build_flags}
    -DBMCU_USB_WORKING_MODE=1

[env:USB_ISP_EXPORT]
extends = env:USB_WORKING_MODE
board_build.ldscript = isp-export.ld
board_upload.maximum_size = 60672
build_flags =
    ${env:USB_WORKING_MODE.build_flags}
    -DBMCU_USB_ISP_EXPORT=1

[env:USB_SETUP_INSERTION_RECOVERY]
extends = env:USB_ISP_EXPORT
build_flags =
    ${env:USB_ISP_EXPORT.build_flags}
    -DBMCU_SETUP_INSERTION_RECOVERY=1
